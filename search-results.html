<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arama Sonuçları | Çankaya Uydu</title>
    <meta name="description" content="Çankaya Uydu arama sonuçları sayfası. Aradığınız hizmeti, teknik desteği ve ürünleri burada bulabilirsiniz.">
    <link rel="canonical" href="https://cankayauydu.com/search-results.html">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Çankaya Uydu">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background: #f7f7f7;
        }
        .container {
            max-width: 700px;
            margin: 50px auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 32px 24px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            color: #27496d;
        }
        #search-form {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
        }
        #search-input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        #search-button {
            background: #27496d;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1rem;
            cursor: pointer;
        }
        .search-result {
            margin-bottom: 18px;
            padding: 16px;
            border-radius: 12px;
            background: #f2f2f2;
            transition: background 0.2s;
        }
        .search-result:hover {
            background: #e2eafc;
        }
        @media (max-width: 600px) {
            .container {
                padding: 16px 6px;
            }
            h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Arama Sonuçları</h1>
        <form id="search-form" onsubmit="return false;">
            <input type="text" id="search-input" placeholder="Aranacak kelimeyi yazın..." autofocus>
            <button id="search-button">Ara</button>
        </form>
        <div id="results"></div>
    </div>
    <script>
        // Statik arama veri örnekleri (Bunları kendi içeriklerine göre düzenleyebilirsin)
        const searchData = [
            {
                title: "Bireysel Çanak Anten Kurulumu",
                description: "Çankaya bölgesinde bireysel çanak anten kurulumu ve ayarı.",
                url: "https://cankayauydu.com/hizmetlerimiz.html#bireysel"
            },
            {
                title: "Merkezi Uydu Sistemleri",
                description: "Apartman ve siteler için merkezi uydu sistemleri kurulumu.",
                url: "https://cankayauydu.com/hizmetlerimiz.html#merkezi"
            },
            {
                title: "Teknik Destek",
                description: "Her türlü çanak anten arızası ve teknik servis desteği.",
                url: "https://cankayauydu.com/iletisim.html"
            },
            {
                title: "Çanak Anten Fiyatları",
                description: "Güncel çanak anten ve uydu sistemi fiyatlarımız.",
                url: "https://cankayauydu.com/fiyatlar.html"
            }
        ];

        function showResults(keyword) {
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            if (!keyword || keyword.trim() === "") {
                resultsDiv.innerHTML = "<p>Lütfen bir anahtar kelime girin.</p>";
                return;
            }
            const results = searchData.filter(item =>
                item.title.toLowerCase().includes(keyword.toLowerCase()) ||
                item.description.toLowerCase().includes(keyword.toLowerCase())
            );
            if (results.length === 0) {
                resultsDiv.innerHTML = "<p>Aradığınız kriterlere uygun sonuç bulunamadı.</p>";
                return;
            }
            results.forEach(item => {
                resultsDiv.innerHTML += `
                    <div class="search-result">
                        <a href="${item.url}" style="font-size:1.1rem;color:#27496d;text-decoration:none;font-weight:bold;" target="_blank">${item.title}</a>
                        <p style="margin:8px 0 0 0;">${item.description}</p>
                    </div>
                `;
            });
        }

        document.getElementById("search-button").onclick = function() {
            const keyword = document.getElementById("search-input").value;
            showResults(keyword);
        };

        // Enter tuşu ile arama için
        document.getElementById("search-input").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                document.getElementById("search-button").click();
            }
        });

        // URL'den otomatik arama parametresi alma
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            if (query) {
                document.getElementById("search-input").value = query;
                showResults(query);
            }
        };
    </script>
</body>
</html>
