<!DOCTYPE html>
<html class="wide wow-animation" lang="tr">
<head>
    <title>Arama Sonuçları - Çankaya Uydu</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="canonical" href="https://cankayauydu.com/search-results.html">
    <meta name="description" content="Çankaya Uydu Arama Sonuçları">
    <meta name="keywords" content="uydu, çanak anten, arıza, kurulum, arama sonuçları">
    <meta name="author" content="Tuncay Özer">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="images/cankayauydu.ico" type="image/x-icon">
    <script src="https://unpkg.com/lunr/lunr.js"></script>
    <script src="search-index.json"></script>
    <style>
        #search-results { margin-top: 30px; }
        .result-item { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        .result-item a { font-weight: bold; font-size: 18px; color: #007bff; }
        .result-item p { margin: 5px 0; }
    </style>
</head>
<body>
<div class="page">
<header class="page-head">... (üst menü HTML içeriğin buraya gelecek - değişmedi)</header>

<section class="section-60 section-sm-110">
  <div class="container">
    <h2 class="text-center">Site İçi Arama</h2>
    <form class="rd-search rd-search-style-1" onsubmit="return false;">
      <div class="form-wrap">
        <input class="form-input" id="search-box" type="text" placeholder="Anahtar kelime yazın...">
      </div>
      <div id="search-results"></div>
    </form>
  </div>
</section>

<footer class="page-foot bg-gray-dark">... (alt menü HTML içeriğin buraya gelecek - değişmedi)</footer>
</div>

<script>
  let idx;
  let pages;
  window.addEventListener("DOMContentLoaded", function() {
    pages = window.siteData;
    idx = lunr(function () {
      this.ref('id');
      this.field('title');
      this.field('content');
      pages.forEach(function (doc) {
        this.add(doc);
      }, this);
    });

    document.getElementById('search-box').addEventListener('input', function() {
      const query = this.value.trim();
      const results = idx.search(query);
      const resultContainer = document.getElementById('search-results');
      resultContainer.innerHTML = '';

      if (results.length > 0) {
        results.forEach(result => {
          const item = pages.find(p => p.id === result.ref);
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `<a href="${item.url}">${item.title}</a><p>${item.content.substring(0, 120)}...</p>`;
          resultContainer.appendChild(div);
        });
      } else {
        resultContainer.innerHTML = '<p>Sonuç bulunamadı.</p>';
      }
    });
  });
</script>
</body>
</html>
