
<!DOCTYPE html>
<html class="wide wow-animation" lang="tr">
<head>
    <title>Çankaya Uydu Servisi, Çanak Anten Uydu Arıza ve Kurulum Servisi</title>
    <meta name="keywords" content="Çanak anten, dikmen uyducu, ayrancı uyducu, öveçler uyducu, sokullu uyducu, balgat uyducu, çanak anten kurulum, çanak anten tamiri, televizyon tamiri, uydu aruza, çanak anten arıza, dikmen, ayrancı, öveçler," />
    <meta name="description" content="Çanak Anten Uydu Sistemleri Arıza ve Kurulum İşlerinizi, Kaliteli Malzemeler ve Profosyonel İşçilik Hizmeti ile Çözüyoruz.." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lunr/lunr.js"></script>
    
    <script>
    window.siteData = [
        {
            "id": "index",
            "title": "Ana Sayfa",
            "url": "index.html",
            "content": "Çankaya Uydu Servisi, çanak anten kurulumu ve arıza çözümleri"
        },
        {
            "id": "hizmetlerimiz",
            "title": "Hizmetlerimiz",
            "url": "hizmetlerimiz.html",
            "content": "Çanak anten kurulumu, merkezi uydu sistemleri, televizyon tamiri"
        },
        {
            "id": "iletisim",
            "title": "İletişim",
            "url": "iletisim.html",
            "content": "Bize ulaşın: adres, telefon, e-posta bilgileri"
        }
    ];
    </script>
    <script src="search-index.json"></script>
    
</head>
<body>
    <div class="page">
        <header class="page-head">...</header>
        <section class="section-60 section-sm-110">
            <div class="container">
                <div class="row">
                    <div class="col-lg-10 col-xl-8">
                        <form class="rd-search rd-search-style-1">
                            <div class="form-wrap">
                                <label class="form-label" for="rd-search-form-input-1">Arama...</label>
                                <input class="form-input" id="rd-search-form-input-1" type="text" name="s" autocomplete="off">
                                <div class="rd-search-results-live" id="rd-search-results-live-1"></div>
                            </div>
                        </form>
                        <div class="rd-search-results"></div>
                    </div>
                </div>
            </div>
        </section>
        <footer class="page-foot bg-gray-dark">...</footer>
    </div>
    <script>
      let idx;
      let pages;
      window.addEventListener("DOMContentLoaded", function () {
        pages = window.siteData;
        idx = lunr(function () {
          this.ref('id');
          this.field('title');
          this.field('content');
          pages.forEach(function (doc) {
            this.add(doc);
          }, this);
        });

        const input = document.getElementById('rd-search-form-input-1');
        const resultContainer = document.querySelector('.rd-search-results');

        input.addEventListener('input', function () {
          const query = input.value.trim();
          const results = idx.search(query);
          resultContainer.innerHTML = '';

          if (results.length > 0) {
            results.forEach(result => {
              const item = pages.find(p => p.id === result.ref);
              const div = document.createElement('div');
              div.className = 'result-item';
              div.innerHTML = `<a href="${item.url}">${item.title}</a><p>${item.content.substring(0, 150)}...</p>`;
              resultContainer.appendChild(div);
            });
          } else {
            resultContainer.innerHTML = '<p>Sonuç bulunamadı.</p>';
          }
        });
      });
    </script>
    <style>
      .rd-search-results { margin-top: 20px; }
      .result-item { padding: 10px; border-bottom: 1px solid #e0e0e0; }
      .result-item a { font-size: 18px; color: #007bff; text-decoration: none; }
      .result-item a:hover { text-decoration: underline; }
    </style>
</body>
</html>
