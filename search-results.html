<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Arama Sonuçları | Çankaya Uydu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>Site İçi Arama</h1>
  <input type="text" id="search-box" placeholder="Aramak istediğiniz kelimeyi yazın..." autofocus>
  <ul id="results"></ul>

  <!-- Lunr.js -->
  <script src="https://unpkg.com/lunr/lunr.js"></script>

  <!-- Site verisi JSON -->
  <script src="search-index.json"></script>

  <script>
    const searchBox = document.getElementById('search-box');
    const resultsList = document.getElementById('results');

    // Lunr index oluştur
    const idx = lunr(function () {
      this.ref('id');
      this.field('title');
      this.field('content');

      window.siteData.forEach(function (doc) {
        this.add(doc);
      }, this);
    });

    searchBox.addEventListener('input', function () {
      const query = this.value;
      resultsList.innerHTML = '';

      if (query.length < 2) return;

      const results = idx.search(query);
      results.forEach(result => {
        const item = window.siteData.find(d => d.id === result.ref);
        const li = document.createElement('li');
        li.innerHTML = `<a href="${item.url}"><strong>${item.title}</strong></a><br><small>${item.content.slice(0, 150)}...</small>`;
        resultsList.appendChild(li);
      });
    });
  </script>
</body>
</html>
