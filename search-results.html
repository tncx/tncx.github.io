<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Site İçi Arama | Çankaya Uydu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lunr/lunr.js"></script>
  <script src="search-index.json"></script>
  <style>
    body { padding: 2rem; background-color: #f8f9fa; }
    #results li { margin-bottom: 1rem; }
    mark { background: yellow; padding: 0 2px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">🔍 Site İçi Arama</h1>
    <div class="input-group mb-4">
      <input type="text" id="search-box" class="form-control" placeholder="Aramak istediğiniz kelimeyi yazın...">
      <button class="btn btn-primary" onclick="doSearch()">Ara</button>
    </div>
    <ul id="results" class="list-group"></ul>
  </div>

  <script>
    let idx;
    let data = [];

    function buildIndex() {
      idx = lunr(function () {
        this.ref('id');
        this.field('title');
        this.field('content');
        data.forEach(function (doc) { this.add(doc); }, this);
      });
    }

    function highlight(text, term) {
      const pattern = new RegExp(`(${term})`, 'gi');
      return text.replace(pattern, '<mark>$1</mark>');
    }

    function doSearch() {
      const query = document.getElementById('search-box').value.trim();
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';

      if (query.length < 2) return;

      const results = idx.search(query);
      if (results.length === 0) {
        resultsContainer.innerHTML = '<li class="list-group-item text-danger">Sonuç bulunamadı.</li>';
        return;
      }

      results.forEach(res => {
        const item = data.find(d => d.id === res.ref);
        const li = document.createElement('li');
        li.className = 'list-group-item';
        li.innerHTML = `
          <a href="${item.url}" class="fw-bold">${highlight(item.title, query)}</a><br>
          <small>${highlight(item.content.slice(0, 150), query)}...</small>
        `;
        resultsContainer.appendChild(li);
      });
    }

    window.onload = () => {
      if (window.siteData) {
        data = window.siteData;
        buildIndex();
      } else {
        fetch('search-index.json')
          .then(res => res.text())
          .then(text => {
            eval(text);
            data = window.siteData;
            buildIndex();
          });
      }
    };
  </script>
</body>
</html>
